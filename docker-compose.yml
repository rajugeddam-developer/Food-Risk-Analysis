services:
  postgres:
    image: postgres:16-alpine
    container_name: foodrisk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-food_risk_analysis}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-food_risk_analysis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - foodrisk-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodrisk-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-food_risk_analysis}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be provided in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      SPRING_PROFILES_ACTIVE: prod
      TESSDATA_PATH: /app/tessdata
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - foodrisk-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodrisk-frontend
    restart: unless-stopped
    ports:
      - "${PORT_HTTP:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - foodrisk-net

volumes:
  postgres_data:
    driver: local

networks:
  foodrisk-net:
    driver: bridge
