# ==============================================================================
# Food Risk Analysis - Production Profile Configuration (spring.profiles.active=prod)
# ==============================================================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    hikari:
      pool-name: FoodRiskProdHikariPool
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: 10000
      idle-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    ignore-migration-patterns: "*:missing,*:future"

server:
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true

logging:
  level:
    com.foodrisk: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.apache.tomcat: WARN
